name: CloudDesk

on:
  workflow_dispatch:

permissions: {}

jobs:
  clouddesk-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. CONECTAR EL RUNNER A TAILSCALE
      # ============================================================

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          Write-Host "======================================"
          Write-Host "       CONECTANDO CLOUDDESK"
          Write-Host "======================================"

          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Error "Falta TAILSCALE_AUTH_KEY."
              exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {

              Write-Host "Instalando Tailscale..."

              $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
              $installer = "$env:TEMP\tailscale.msi"

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer

              Start-Process `
                msiexec.exe `
                -ArgumentList `
                  "/i",
                  "`"$installer`"",
                  "/quiet",
                  "/norestart" `
                -Wait

              Remove-Item `
                $installer `
                -Force
          }

          if (-not (Test-Path $tailscale)) {

              Write-Error "No se pudo instalar Tailscale."
              exit 1
          }

          Write-Host "Iniciando Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="clouddesk-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Tailscale no pudo autenticarse."
              exit 1
          }

          Write-Host "Tailscale conectado."

          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {

              $tsIP = & $tailscale ip -4 2>$null

              if ($tsIP) {

                  $tsIP = $tsIP.Trim()

                  if ($tsIP) {
                      break
                  }
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {

              Write-Error "No se obtuvo IP de Tailscale."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "IP Tailscale:"
          Write-Host $tsIP


      # ============================================================
      # 2. CONFIGURAR RDP
      # ============================================================

      - name: Configure Remote Desktop
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "       CONFIGURANDO RDP"
          Write-Host "======================================"

          # Habilitar RDP
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # NLA activado
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Seguridad RDP
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          # Puerto
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'PortNumber' `
            -Value 3389 `
            -Force

          # Firewall
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          # Regla específica para CloudDesk
          netsh advfirewall firewall delete rule `
            name="CloudDesk-RDP"

          netsh advfirewall firewall add rule `
            name="CloudDesk-RDP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Servicio
          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 5

          Write-Host "RDP configurado."


      # ============================================================
      # 3. CONFIGURAR RUNNERADMIN
      # ============================================================

      - name: Configure runneradmin
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          Write-Host "Configurando runneradmin..."

          if (-not $env:RDP_PASSWORD) {

              Write-Error `
                "Falta el secret RDP_PASSWORD."

              exit 1
          }

          $user = Get-LocalUser `
            -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if (-not $user) {

              Write-Error `
                "El usuario runneradmin no existe."

              exit 1
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $securePassword

          # Asegurar que está habilitado
          Enable-LocalUser `
            -Name "runneradmin"

          # Asegurar permisos RDP
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          Write-Host "runneradmin configurado."


      # ============================================================
      # 4. COMPROBAR SERVICIO
      # ============================================================

      - name: Verify RDP Service
        shell: powershell
        run: |

          Write-Host "Comprobando TermService..."

          $service = Get-Service `
            -Name TermService

          Write-Host "Estado: $($service.Status)"
          Write-Host "Inicio: $($service.StartType)"

          if ($service.Status -ne "Running") {

              Start-Service `
                -Name TermService

              Start-Sleep -Seconds 5
          }

          $service = Get-Service `
            -Name TermService

          if ($service.Status -ne "Running") {

              Write-Error `
                "TermService no está funcionando."

              exit 1
          }

          Write-Host "TermService OK."


      # ============================================================
      # 5. COMPROBAR PUERTO 3389
      # ============================================================

      - name: Verify RDP Port
        shell: powershell
        run: |

          Write-Host "Comprobando puerto 3389..."

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {

              Restart-Service `
                -Name TermService `
                -Force

              Start-Sleep -Seconds 10

              $listener = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue
          }

          if (-not $listener) {

              Write-Error `
                "3389 no está escuchando."

              exit 1
          }

          Write-Host ""
          Write-Host "3389 está escuchando."

          $listener |
            Format-Table `
              LocalAddress,
              LocalPort,
              State,
              OwningProcess


      # ============================================================
      # 6. COMPROBAR RUNNERADMIN
      # ============================================================

      - name: Verify runneradmin
        shell: powershell
        run: |

          Write-Host "Comprobando runneradmin..."

          $user = Get-LocalUser `
            -Name "runneradmin"

          Write-Host ""
          Write-Host "Usuario:"
          Write-Host $user.Name

          Write-Host ""
          Write-Host "Activo:"
          Write-Host $user.Enabled

          Write-Host ""
          Write-Host "Remote Desktop Users:"

          Get-LocalGroupMember `
            -Group "Remote Desktop Users" |
            Format-Table Name, ObjectClass


      # ============================================================
      # 7. COMPROBAR RDP LOCAL
      # ============================================================

      - name: Test Local RDP
        shell: powershell
        run: |

          Write-Host "Probando RDP local..."

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389

          Write-Host ""
          Write-Host "Resultado:"
          Write-Host $test.TcpTestSucceeded

          if (-not $test.TcpTestSucceeded) {

              Write-Error `
                "RDP no responde localmente."

              exit 1
          }

          Write-Host "RDP local OK."


      # ============================================================
      # 8. COMPROBAR RDP POR TAILSCALE
      # ============================================================

      - name: Test Tailscale RDP
        shell: powershell
        run: |

          Write-Host "Probando RDP mediante Tailscale..."

          Write-Host ""
          Write-Host "IP:"
          Write-Host $env:TAILSCALE_IP

          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          Write-Host ""
          Write-Host "Resultado:"
          Write-Host $test.TcpTestSucceeded

          if (-not $test.TcpTestSucceeded) {

              Write-Error `
                "RDP no responde mediante Tailscale."

              exit 1
          }

          Write-Host "RDP mediante Tailscale OK."


      # ============================================================
      # 9. MOSTRAR DATOS
      # ============================================================

      - name: CloudDesk Ready
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             CLOUDDESK LISTO"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "PC:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""

          Write-Host "Usuario:"
          Write-Host "runneradmin"

          Write-Host ""

          Write-Host "Puerto:"
          Write-Host "3389"

          Write-Host ""

          Write-Host "Gateway:"
          Write-Host "NINGUNO"

          Write-Host ""

          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Conecta Windows App usando:"
          Write-Host ""
          Write-Host "PC: $env:TAILSCALE_IP"
          Write-Host "Usuario: runneradmin"
          Write-Host "Gateway: Ninguno"
          Write-Host ""
          Write-Host "La contraseña está almacenada en"
          Write-Host "el secret RDP_PASSWORD."
          Write-Host ""
          Write-Host "=============================================="


      # ============================================================
      # 10. MANTENER RUNNER
      # ============================================================

      - name: Keep CloudDesk Running
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "        CLOUDDESK ACTIVO"
          Write-Host "======================================"
          Write-Host ""

          while ($true) {

              Write-Host `
                "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] CloudDesk activo"

              Start-Sleep `
                -Seconds 300
          }
